    - Confusion matrix se accuracy, precision, recall aur F1 nikaalna
    - Errors ki asli cost ke hisaab se metric chunna
sections:
  explanation:
    en: |
      A model is only useful if it works on **data it has never seen**. So we split data:

      - **Training set** — the model learns from it.
      - **Validation set** — you use it to compare settings and models while developing.
      - **Test set** — touched once at the end for an honest estimate.

      **Overfitting**: great on training data, poor on new data (it memorised). **Underfitting**:
      poor everywhere (too simple). **Data leakage**: information from the test set (or from the
      future) sneaks into training — scores look amazing and collapse in production.

      For classification, count the four outcomes in a **confusion matrix**: true positives (TP),
      false positives (FP), false negatives (FN), true negatives (TN). Then:

      - **Accuracy** = (TP + TN) / all — misleading when classes are imbalanced.
      - **Precision** = TP / (TP + FP) — "when the model says yes, how often is it right?"
      - **Recall** = TP / (TP + FN) — "of all real yeses, how many did it find?"
      - **F1** = harmonic mean of precision and recall.

      Choose by **cost**: missing fraud is expensive → prioritise recall. Flagging a customer's
      legitimate payment is annoying → watch precision. A model that predicts "not fraud" for
      everything can have 99% accuracy and be useless.

      These ideas carry straight into GenAI evaluation: RAG retrieval has precision and recall too,
      and every evaluation needs a held-out dataset you did not tune on.
    hinglish: |
      Model tabhi kaam ka hai jab woh **aise data par chale jo usne kabhi nahi dekha**. Isliye hum
      data split karte hain:

      - **Training set** — model isse seekhta hai.
      - **Validation set** — development ke dauraan settings aur models compare karne ke liye.
      - **Test set** — honest estimate ke liye end mein sirf ek baar use hota hai.

      **Overfitting**: training data par shaandaar, naye data par kharab (ratta maar liya).
      **Underfitting**: har jagah kharab (bahut simple). **Data leakage**: test set (ya future) ki
      information training mein ghus jaati hai — scores kamaal dikhte hain aur production mein gir
      jaate hain.

      Classification ke liye **confusion matrix** mein chaar outcomes gino: true positives (TP),
      false positives (FP), false negatives (FN), true negatives (TN). Phir:

      - **Accuracy** = (TP + TN) / sab — classes imbalanced hon to misleading.
      - **Precision** = TP / (TP + FP) — "jab model haan bolta hai, kitni baar sahi hota hai?"
      - **Recall** = TP / (TP + FN) — "saare asli haan mein se kitne pakde?"
      - **F1** = precision aur recall ka harmonic mean.

      **Cost** ke hisaab se chuno: fraud miss karna mehenga hai → recall ko priority. Customer ki
      sahi payment ko flag karna pareshaan karta hai → precision par nazar. Jo model har cheez ko
      "not fraud" bole uski accuracy 99% ho sakti hai aur woh bekaar hai.

      Ye ideas seedhe GenAI evaluation mein jaate hain: RAG retrieval mein bhi precision aur recall
      hote hain, aur har evaluation ko ek held-out dataset chahiye jis par aapne tuning na ki ho.
  analogy:
    en: |
      A student who memorises last year's exam paper aces the mock test made from it (training
      data) and fails the real exam (new data) — that's overfitting. If the real exam questions
      leaked beforehand, the high score proves nothing — that's leakage.
    hinglish: |
      Jo student pichle saal ka paper ratta maar le, woh usi se bane mock test (training data) mein
      top karega aur asli exam (naya data) mein fail — yeh overfitting hai. Agar asli exam ke
      sawaal pehle leak ho gaye, to high score kuch prove nahi karta — yeh leakage hai.
  guidedExercise:
    en: |
      1. Run the code example and recompute precision and recall by hand from TP, FP and FN.
      2. Change one prediction from 1 to 0 for a true spam email. Which metric drops?
      3. Make a "lazy" model that predicts 0 for every email. Compute its accuracy and recall.
      4. Decide: for a medical screening test, would you rather have high precision or high recall? Why?
    hinglish: |
      1. Code example chalao aur TP, FP aur FN se precision aur recall haath se dobara nikaalo.
      2. Ek asli spam email ki prediction 1 se 0 karo. Kaunsa metric girta hai?
      3. Ek "aalsi" model banao jo har email ke liye 0 predict kare. Uski accuracy aur recall nikaalo.
      4. Decide karo: medical screening test ke liye high precision chahiye ya high recall? Kyun?
  challenge:
    en: |
      A RAG system retrieves 5 chunks per question. For 10 test questions you know which chunks are
      relevant. Define retrieval precision@5 and recall@5 in your own words and compute them for one
      example.
    hinglish: |
      Ek RAG system har question ke liye 5 chunks retrieve karta hai. 10 test questions ke liye aapko
      pata hai kaunse chunks relevant hain. Retrieval precision@5 aur recall@5 apne shabdon mein
      define karo aur ek example ke liye calculate karo.
  commonMistakes:
    en:
      - Tuning on the test set until the score looks good
      - Reporting accuracy on heavily imbalanced data
      - Random splits for time-based data (the future leaks into training)
      - Duplicates of the same example appearing in both train and test
    hinglish:
      - Test set par tuning karte rehna jab tak score achha na dikhe
      - Bahut imbalanced data par accuracy report karna
      - Time-based data ke liye random split (future training mein leak hota hai)
      - Ek hi example ke duplicates train aur test dono mein hona
  projectApplication:
    en: |
      For the Text Summarizer and the RAG assistant you will build a small, versioned evaluation
      set and never tune your prompts on its held-out half — the same discipline as a test set.
    hinglish: |
      Text Summarizer aur RAG assistant ke liye aap ek chhota, versioned evaluation set banaoge aur
      uske held-out half par kabhi prompts tune nahi karoge — test set wali hi discipline.
  summary:
    en:
      - Train to learn, validate to choose, test once to report
      - Overfitting memorises; leakage cheats; both inflate scores
      - Precision = correctness of positives; recall = coverage of positives
      - Pick metrics by the real cost of false positives versus false negatives
    hinglish:
      - Seekhne ke liye train, chunne ke liye validate, report karne ke liye ek baar test
      - Overfitting ratta maarta hai; leakage cheating karta hai; dono scores badhaate hain
      - Precision = positives ki sahi-pana; recall = positives ka coverage
      - Metrics false positives aur false negatives ki asli cost se chuno
codeExamples:
  - id: confusion-metrics
    title:
      en: Metrics from a confusion matrix
      hinglish: Confusion matrix se metrics
    variants:
      python: |
        # 1 = "spam", 0 = "not spam"
        y_true = [1, 0, 1, 1, 0, 0, 1, 0, 0, 0]
        y_pred = [1, 1, 0, 1, 1, 0, 1, 0, 0, 0]

        tp = sum(1 for t, p in zip(y_true, y_pred) if t == 1 and p == 1)
        fp = sum(1 for t, p in zip(y_true, y_pred) if t == 0 and p == 1)
        fn = sum(1 for t, p in zip(y_true, y_pred) if t == 1 and p == 0)
        tn = sum(1 for t, p in zip(y_true, y_pred) if t == 0 and p == 0)

        accuracy = (tp + tn) / len(y_true)
        precision = tp / (tp + fp)
        recall = tp / (tp + fn)
        f1 = 2 * precision * recall / (precision + recall)
        print(f"TP={tp} FP={fp} FN={fn} TN={tn}")
        print(f"accuracy={accuracy:.2f} precision={precision:.2f} recall={recall:.2f} f1={f1:.2f}")
    expectedOutput: |
      TP=3 FP=2 FN=1 TN=4
      accuracy=0.70 precision=0.60 recall=0.75 f1=0.67
