      pass
tests:
  - id: identical
    name: identical direction gives 1
    code: |
      assert abs(cosine_similarity([1, 2, 3], [2, 4, 6]) - 1.0) < 1e-9
  - id: orthogonal
    name: perpendicular gives 0 and opposite gives -1
    code: |
      assert abs(cosine_similarity([1, 0], [0, 1])) < 1e-9
      assert abs(cosine_similarity([1, 0], [-1, 0]) + 1.0) < 1e-9
  - id: known-value
    name: matches a hand-computed value
    code: |
      assert abs(cosine_similarity([0.9, 0.8, 0.1], [0.85, 0.75, 0.2]) - 0.99578) < 1e-4
  - id: errors
    name: rejects bad input
    code: |
      for a, b in [([1, 2], [1, 2, 3]), ([], []), ([0, 0], [1, 1])]:
          try:
              cosine_similarity(a, b)
          except ValueError:
              continue
          raise AssertionError(f"expected ValueError for {a}, {b}")
  - id: top-k
    name: returns indices of the most similar documents
    code: |
      docs = [[0.1, 0.9], [0.9, 0.1], [0.7, 0.3], [0.0, 1.0]]
      assert top_k([1.0, 0.0], docs, 2) == [1, 2]
      assert top_k([0.0, 1.0], docs, 1) == [3]
hints:
  en:
    - Check len(a) == len(b) and len(a) > 0 before computing anything
    - Compute both norms; if either is 0, raise ValueError
    - "For top_k, sort indices with key=lambda i: -scores[i]; Python's sort is stable, so ties keep order"
  hinglish:
    - Kuch bhi compute karne se pehle len(a) == len(b) aur len(a) > 0 check karo
    - Dono norms nikaalo; koi 0 ho to ValueError raise karo
    - 'top_k ke liye indices ko key=lambda i: -scores[i] se sort karo; Python ka sort stable hai, tie par order bana rehta hai'
solution: |
  import math


  def cosine_similarity(a, b):
      if len(a) != len(b) or len(a) == 0:
          raise ValueError("vectors must be non-empty and the same length")
      dot = sum(x * y for x, y in zip(a, b))
      norm_a = math.sqrt(sum(x * x for x in a))
      norm_b = math.sqrt(sum(y * y for y in b))
      if norm_a == 0 or norm_b == 0:
          raise ValueError("zero vectors have no direction")
      return dot / (norm_a * norm_b)


  def top_k(query, docs, k):
      scores = [cosine_similarity(query, doc) for doc in docs]
      ranked = sorted(range(len(docs)), key=lambda i: -scores[i])
      return ranked[:k]
