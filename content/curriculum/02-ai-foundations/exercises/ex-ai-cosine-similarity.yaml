lessonId: ai-vectors-similarity
language: python
topics: [vector-similarity, vectors]
title:
  en: Implement cosine similarity and top-k search
  hinglish: Cosine similarity aur top-k search implement karo
prompt:
  en: |
    Without NumPy, implement:

    1. `cosine_similarity(a, b)` — returns the cosine similarity of two equal-length lists of
       numbers. Raise `ValueError` if the lengths differ, if a list is empty, or if either vector
       has zero length.
    2. `top_k(query, docs, k)` — returns the **indices** of the `k` documents in `docs` (a list of
       vectors) most similar to `query`, best first. Ties keep the original order.
  hinglish: |
    NumPy ke bina implement karo:

    1. `cosine_similarity(a, b)` — do barabar length ki number lists ki cosine similarity return
       kare. Lengths alag hon, list khaali ho, ya koi vector zero length ka ho to `ValueError`.
    2. `top_k(query, docs, k)` — `docs` (vectors ki list) mein se `query` se sabse similar `k`
       documents ke **indices** return kare, best pehle. Tie par original order bana rahe.
