id: py-http-apis
slug: http-apis-and-environment-variables
version: 2
status: published
estimatedMinutes: 35
prerequisites: [py-files-json-errors]
topics: [http, api-integration, environment-variables, retries]
title:
  en: HTTP APIs, environment variables and retries
  hinglish: HTTP APIs, environment variables aur retries
summary:
  en: How requests and responses work, how to keep API keys out of code, and how to retry only the failures worth retrying.
  hinglish: Requests aur responses kaise kaam karte hain, API keys ko code se bahar kaise rakhein, aur sirf retry karne layak failures ko retry kaise karein.
objectives:
  en:
    - Describe an HTTP request (method, URL, headers, body) and response (status, body)
    - Read secrets from environment variables instead of source code
    - Set timeouts on every network call
    - Decide which status codes to retry and back off exponentially
  hinglish:
    - HTTP request (method, URL, headers, body) aur response (status, body) samjhana
    - Secrets ko source code ki jagah environment variables se padhna
    - Har network call par timeout lagana
    - Decide karna kaunse status codes retry karne hain aur exponential backoff karna
sections:
  explanation:
    en: |
      Every LLM provider is reached over **HTTP**. A request has a **method** (`POST` to create a
      completion), a **URL**, **headers** (authentication, content type) and a **body** (usually
      JSON). The response has a **status code** and a body.

      | Status | Meaning | Retry? |
      | --- | --- | --- |
      | 200–299 | Success | — |
      | 400 | Your request is invalid | No — fix the request |
      | 401 / 403 | Bad or missing credentials | No — fix the key or permissions |
      | 404 | Wrong URL or model name | No |
      | 408 / 429 | Timeout / rate limited | Yes, after waiting |
      | 500 / 502 / 503 / 504 | Server-side problem | Yes, a few times |

      **Secrets** such as API keys must never be written in code — code ends up in Git, screenshots
      and chat messages. Read them from **environment variables**: `os.environ["AI_API_KEY"]`
      (raises `KeyError` if missing — good, fail fast) and keep them in a `.env` file that is listed
      in `.gitignore`.

      **Timeouts**: a request without a timeout can hang forever. Always pass one.

      **Exponential backoff**: wait 1 s, then 2 s, then 4 s… between retries, with a maximum. Many
      providers send a `Retry-After` header on 429 — respect it when present. Retrying a `400`
      just burns money and time.
    hinglish: |
      Har LLM provider tak **HTTP** se pahuncha jaata hai. Request mein ek **method** (`POST`
      completion banane ke liye), ek **URL**, **headers** (authentication, content type) aur ek
      **body** (aksar JSON) hota hai. Response mein **status code** aur body hoti hai.

      | Status | Matlab | Retry? |
      | --- | --- | --- |
      | 200–299 | Success | — |
      | 400 | Aapki request invalid hai | Nahi — request theek karo |
      | 401 / 403 | Galat ya missing credentials | Nahi — key ya permissions theek karo |
      | 404 | Galat URL ya model name | Nahi |
      | 408 / 429 | Timeout / rate limited | Haan, ruk kar |
      | 500 / 502 / 503 / 504 | Server-side problem | Haan, kuch baar |

      API keys jaise **secrets** kabhi code mein mat likho — code Git, screenshots aur chat
      messages tak pahunch jaata hai. Unhe **environment variables** se padho:
      `os.environ["AI_API_KEY"]` (missing ho to `KeyError` — achha hai, jaldi fail) aur unhe `.env`
      file mein rakho jo `.gitignore` mein listed ho.

      **Timeouts**: bina timeout wali request hamesha atak sakti hai. Hamesha timeout do.

      **Exponential backoff**: retries ke beech 1 s, phir 2 s, phir 4 s… ruko, ek maximum ke saath.
      Kai providers 429 par `Retry-After` header bhejte hain — mile to use respect karo. `400` ko
      retry karna sirf paisa aur time jalata hai.
  analogy:
    en: |
      Calling an API is like **ordering at a busy restaurant**. If the kitchen says "we're full,
      come back in 5 minutes" (429), you wait and come back. If they say "that dish doesn't exist"
      (400/404), shouting the same order again will not help — you change the order. Your API key
      is your membership card: you show it at the counter, you don't paint it on the wall.
    hinglish: |
      API call karna **bheed wale restaurant mein order dene** jaisa hai. Agar kitchen kahe "abhi
      full hai, 5 minute baad aao" (429), to aap ruk kar wapas aate ho. Agar kahe "yeh dish hai hi
      nahi" (400/404), to wahi order zor se dohrane se kuch nahi hoga — order badalna padega. Aapki
      API key membership card hai: counter par dikhate ho, deewar par paint nahi karte.
  guidedExercise:
    en: |
      1. Create a `.env` file containing `AI_API_KEY=test-key` and make sure `.env` is in `.gitignore`.
      2. Read the key with `os.environ.get("AI_API_KEY")` and print only its length — never the key.
      3. Write a function that returns `True` for status codes worth retrying, using the table above.
      4. Print the backoff schedule for attempts 0–5 with a base of 1 s and a cap of 8 s.
    hinglish: |
      1. `AI_API_KEY=test-key` wali `.env` file banao aur pakka karo ki `.env` `.gitignore` mein hai.
      2. `os.environ.get("AI_API_KEY")` se key padho aur sirf uski length print karo — key kabhi nahi.
      3. Ek function likho jo upar wali table ke hisaab se retry layak status codes par `True` de.
      4. 1 s base aur 8 s cap ke saath attempts 0–5 ka backoff schedule print karo.
  challenge:
    en: |
      Add **jitter**: multiply each backoff by a random factor between 0.5 and 1.0. Explain in one
      sentence why jitter helps when thousands of clients are rate-limited at the same moment.
    hinglish: |
      **Jitter** add karo: har backoff ko 0.5 aur 1.0 ke beech ke random factor se multiply karo. Ek
      sentence mein samjhao ki jab hazaaron clients ek saath rate-limited hon to jitter kyun madad karta hai.
  commonMistakes:
    en:
      - Hard-coding API keys in source files or notebooks
      - Calling APIs without a timeout
      - Retrying client errors such as 400, 401 and 404
      - Retrying immediately in a tight loop, which makes rate limiting worse
    hinglish:
      - Source files ya notebooks mein API keys hard-code karna
      - Bina timeout ke APIs call karna
      - 400, 401 aur 404 jaise client errors ko retry karna
      - Tight loop mein turant retry karna, jisse rate limiting aur badh jaati hai
  projectApplication:
    en: |
      Project 1, the Python API Assistant, is exactly this lesson: a CLI that reads its key from the
      environment, calls an API with a timeout, retries only retryable failures with backoff, and
      prints a friendly error otherwise.
    hinglish: |
      Project 1, Python API Assistant, bilkul yahi lesson hai: ek CLI jo key environment se padhta
      hai, timeout ke saath API call karta hai, sirf retry layak failures ko backoff ke saath retry
      karta hai, aur warna ek friendly error print karta hai.
  summary:
    en:
      - A request = method + URL + headers + body; a response = status + body
      - Secrets live in environment variables, never in code
      - Every network call needs a timeout
      - Retry 408/429/5xx with exponential backoff; never retry 400/401/403/404
    hinglish:
      - Request = method + URL + headers + body; response = status + body
      - Secrets environment variables mein rehte hain, code mein kabhi nahi
      - Har network call ko timeout chahiye
      - 408/429/5xx ko exponential backoff ke saath retry karo; 400/401/403/404 kabhi nahi
codeExamples:
  - id: py-http-call
    title:
      en: A careful HTTP call (OpenAI-compatible endpoint)
      hinglish: Ek careful HTTP call (OpenAI-compatible endpoint)
    description:
      en: Works with any OpenAI-compatible server, including a local Ollama at http://localhost:11434/v1. Install with `pip install httpx`.
      hinglish: Kisi bhi OpenAI-compatible server ke saath chalta hai, local Ollama (http://localhost:11434/v1) bhi. Install — `pip install httpx`.
    variants:
      python: |
        import os
        import time

        import httpx

        BASE_URL = os.environ.get("AI_BASE_URL", "http://localhost:11434/v1")
        API_KEY = os.environ.get("AI_API_KEY", "")  # local servers may not need one
        MODEL = os.environ["AI_MODEL"]              # fail fast if not configured

        RETRYABLE = {408, 429, 500, 502, 503, 504}


        def chat(prompt: str, max_attempts: int = 3) -> str:
            for attempt in range(max_attempts):
                try:
                    response = httpx.post(
                        f"{BASE_URL}/chat/completions",
                        headers={"Authorization": f"Bearer {API_KEY}"},
                        json={"model": MODEL, "messages": [{"role": "user", "content": prompt}]},
                        timeout=30.0,
                    )
                except httpx.TransportError as err:  # network problems are retryable
                    print(f"network error: {err}")
                else:
                    if response.status_code == 200:
                        return response.json()["choices"][0]["message"]["content"]
                    if response.status_code not in RETRYABLE:
                        raise RuntimeError(f"API error {response.status_code}: {response.text[:200]}")
                time.sleep(min(8, 2 ** attempt))
            raise RuntimeError("API still failing after retries")


        print(chat("Explain HTTP status 429 in one sentence."))
      typescript: |
        const BASE_URL = process.env.AI_BASE_URL ?? "http://localhost:11434/v1";
        const API_KEY = process.env.AI_API_KEY ?? ""; // local servers may not need one
        const MODEL = process.env.AI_MODEL;
        if (!MODEL) throw new Error("AI_MODEL is not set");

        const RETRYABLE = new Set([408, 429, 500, 502, 503, 504]);
        const sleep = (ms: number) => new Promise((r) => setTimeout(r, ms));

        async function chat(prompt: string, maxAttempts = 3): Promise<string> {
          for (let attempt = 0; attempt < maxAttempts; attempt++) {
            try {
              const res = await fetch(`${BASE_URL}/chat/completions`, {
                method: "POST",
                headers: { Authorization: `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: MODEL, messages: [{ role: "user", content: prompt }] }),
                signal: AbortSignal.timeout(30_000),
              });
              if (res.ok) {
                const data = await res.json();
                return data.choices[0].message.content;
              }
              if (!RETRYABLE.has(res.status)) {
                throw new Error(`API error ${res.status}: ${(await res.text()).slice(0, 200)}`);
              }
            } catch (err) {
              if (err instanceof Error && err.message.startsWith("API error")) throw err;
              console.log("network error:", (err as Error).message);
            }
            await sleep(Math.min(8, 2 ** attempt) * 1000);
          }
          throw new Error("API still failing after retries");
        }

        console.log(await chat("Explain HTTP status 429 in one sentence."));
