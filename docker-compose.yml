# Local infrastructure for GenPath AI.
#   docker compose up -d mongo redis          # databases only (recommended for development)
#   docker compose --profile app up --build   # full stack in containers
name: genpath-ai

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/genpath_ai
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: '1'
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - '127.0.0.1:4000:4000'

  worker:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/worker.js']
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/genpath_ai
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
    environment:
      API_URL: http://api:4000
    depends_on:
      - api
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  mongo-data:
  redis-data:
